name: InfraGenie Review

on:
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"
      - "**.tf"
      - "Dockerfile*"
      - "**.go"

jobs:
  review:
    name: Golden Path review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # Recommended: the published action bundles infragenie + all scanners.
      - name: Golden Path review
        uses: basebandit/infragenie@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          goldenpath: goldenpath.yml
          provider: anthropic
          fail-on: high
          budget-tokens: "50000"
          budget-usd: "0.50"
          # Posts/updates one summary comment on the PR (needs pull-requests: write
          # above). Set to "false" to rely on inline annotations only.
          comment: "true"

