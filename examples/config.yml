# ~/.config/infragenie/config.yml
#
# User-level configuration for infragenie.
# Resolution order: CLI flags > env vars > this file > built-in defaults.
#
# Copy to ~/.config/infragenie/config.yml or .infragenie.yml in your project root.
#
# SECRETS: never commit a real api_key. Either leave it empty (the matching env
# var is checked first) or reference the env var with ${VAR}, which is expanded
# when the file is read. A committed file then carries the reference, not the key.

providers:
  # Default provider used when --provider is not specified.
  default: openai

  openai:
    # Referenced from the environment; nothing secret is stored in this file.
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o-mini
    max_tokens: 4000
    temperature: 0.1

  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-3-5-haiku-20241022
    max_tokens: 4000
    temperature: 0.1

  google:
    api_key: ${GOOGLE_API_KEY}
    model: gemini-1.5-flash
    max_tokens: 4000
    temperature: 0.1

  azure:
    api_key: ${AZURE_OPENAI_API_KEY}
    endpoint: https://your-resource.openai.azure.com
    model: gpt-4
    max_tokens: 4000

  # Self-hosted / Ollama — no API key needed.
  local:
    base_url: http://localhost:11434
    model: llama3
    max_tokens: 4000

defaults:
  format: text          # text | json | github
  fail_on: high         # critical | high | medium | low
  budget:
    tokens: 50000
    usd: 0.50
