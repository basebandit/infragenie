# ~/.config/infragenie/config.yml
#
# User-level configuration for infragenie.
# Resolution order: CLI flags > env vars > this file > built-in defaults.
#
# Copy to ~/.config/infragenie/config.yml or .infragenie.yml in your project root.

providers:
  # Default provider used when --provider is not specified.
  default: openai

  openai:
    # api_key can be omitted — OPENAI_API_KEY env var is checked first.
    api_key: ""
    model: gpt-4o-mini
    max_tokens: 4000
    temperature: 0.1

  anthropic:
    # api_key can be omitted — ANTHROPIC_API_KEY env var is checked first.
    api_key: ""
    model: claude-3-5-haiku-20241022
    max_tokens: 4000
    temperature: 0.1

  google:
    api_key: ""
    model: gemini-1.5-flash
    max_tokens: 4000
    temperature: 0.1

  azure:
    api_key: ""
    endpoint: https://your-resource.openai.azure.com
    model: gpt-4
    max_tokens: 4000

  # Self-hosted / Ollama — no API key needed.
  local:
    base_url: http://localhost:11434
    model: llama3
    max_tokens: 4000

defaults:
  format: text          # text | json | github
  fail_on: high         # critical | high | medium | low
  budget:
    tokens: 50000
    usd: 0.50
