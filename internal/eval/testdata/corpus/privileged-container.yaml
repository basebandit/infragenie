name: privileged-container
description: A privileged container is flagged when the Golden Path forbids it.
goldenpath:
  version: 1
  security:
    forbid_privileged: true
manifests:
  deploy.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: bad
    spec:
      replicas: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bad
        spec:
          containers:
            - name: bad
              image: bad:1.0.0
              securityContext:
                privileged: true
              resources:
                limits: {cpu: "500m", memory: "256Mi"}
                requests: {cpu: "250m", memory: "128Mi"}
              livenessProbe:
                httpGet: {path: /healthz, port: 8080}
              readinessProbe:
                httpGet: {path: /readyz, port: 8080}
expected:
  - {rule_id: goldenpath.security.forbid-privileged, file: deploy.yaml}
