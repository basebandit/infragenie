name: insecure-deployment
description: Reliability-clean Deployment that violates every security rule.
goldenpath:
  version: 1
  security:
    require_non_root: true
    require_read_only_rootfs: true
    require_network_policy: true
    forbid_image_tag_latest: true
manifests:
  deploy.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: bad
    spec:
      replicas: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bad
        spec:
          securityContext:
            runAsUser: 0
          containers:
            - name: bad
              image: bad:latest
              resources:
                limits: {cpu: "500m", memory: "256Mi"}
                requests: {cpu: "250m", memory: "128Mi"}
              livenessProbe:
                httpGet: {path: /healthz, port: 8080}
              readinessProbe:
                httpGet: {path: /readyz, port: 8080}
expected:
  - {rule_id: goldenpath.security.require-non-root, file: deploy.yaml}
  - {rule_id: goldenpath.security.require-readonly-rootfs, file: deploy.yaml}
  - {rule_id: goldenpath.security.no-latest-tag, file: deploy.yaml}
  - {rule_id: goldenpath.security.require-network-policy, file: deploy.yaml}
